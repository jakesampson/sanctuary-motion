name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: x86_64-apple-darwin
            label: macOS Intel
            bundles: app
          - os: macos-15
            target: aarch64-apple-darwin
            label: macOS Apple Silicon
            bundles: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows 11
            bundles: nsis
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sanctuary Motion v1.1.0
          releaseBody: |
            Sanctuary Motion 1.1.0 — an offline desktop studio for seamless worship backgrounds.

            This release adds 20 clean, smooth lyric-safe looks inspired by Motion Worship collections: layered ridges, candlelight, breathing apertures, haze, veils, towers, neon, dreamscape, smoke, aurora, bokeh, canyon rays, planets, treelights, clouds, ripples, deep flow, autumn leaves, and wheat fields. Motion stays opt-in, fine-tune controls live on the Motion page, Reset all restores a fresh scene, and every text effect shares one glyph size.

            **Downloads**
            - Windows 11 (x64 NSIS installer)
            - macOS 11+ Intel (.app)
            - macOS 11+ Apple Silicon (.app)

            No account or internet connection is needed to use the app. macOS builds are ad-hoc signed and not notarized; right-click and choose Open if Gatekeeper warns. Windows needs WebView2, which the installer can provide.
          releaseDraft: true
          prerelease: false
          args: --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          retryAttempts: 3
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
